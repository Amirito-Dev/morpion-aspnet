<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer une partie</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 40px 20px;
        text-align: center;
        background-color: #0f172a;
        color: #f8fafc;
    }

    #join-inputs {
        border: none;
        padding: 0;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 320px;
    }

    #code-input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 16px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-align: center;
        background: #1e293b;
        color: #f8fafc;
        border: 2px solid #334155;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #code-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    #code-input::placeholder {
        letter-spacing: normal;
        font-weight: 400;
        font-size: 14px;
        color: #64748b;
    }

    button {
        width: 100%;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.05s, opacity 0.2s, box-shadow 0.2s;
    }

    button:active:not(:disabled) {
        transform: scale(0.98);
    }

    #btn-create { background-color: #2563eb; color: #ffffff; }
    #btn-create:hover:not(:disabled) { background-color: #1d4ed8; }

    #btn-join { background-color: #334155; color: #f1f5f9; }
    #btn-join:hover:not(:disabled) { background-color: #475569; }

    button:disabled,
    fieldset:disabled button,
    fieldset:disabled input {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(0.2);
    }

    #game-code {
        margin-top: 24px;
        font-size: 22px;
        font-weight: 700;
        color: #60a5fa;
        letter-spacing: 2px;
    }

    #status {
        margin-top: 8px;
        font-size: 14px;
        color: #94a3b8;
    }

    #game-board {
        border: none;
        padding: 0;
        margin: 30px auto 0 auto;
        display: none; 
        flex-direction: column;
        align-items: center;
        gap: 16px;
    }

    #winner-text {
        margin: 0;
        font-size: 28px;
        color: #f8fafc;
        min-height: 34px;
    }

    #score-text {
        font-size: 15px;
        font-weight: 500;
        background: #1e293b;
        padding: 12px 24px;
        border-radius: 8px;
        border: 1px solid #334155;
        color: #cbd5e1;
        line-height: 1.6;
        margin: 0 auto 10px auto;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        display: none; /* Masqué tant qu'il n'y a pas de score */
    }

    #turn-indicator {
        font-size: 16px;
        font-weight: 600;
        color: #cbd5e1;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 90px);
        grid-gap: 10px;
        justify-content: center;
    }

    .cell {
        width: 90px;
        height: 90px;
        font-size: 38px;
        font-weight: 800;
        background-color: #1e293b;
        color: #f8fafc;
        border: 2px solid #334155;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s, border-color 0.15s;
    }

    .cell:hover:not(:disabled) {
        background-color: #334155;
        border-color: #3b82f6;
    }

    .cell:disabled { cursor: not-allowed; }

    .cell[data-symbol="X"] {
        color: #ef4444; /* Rouge */
    }

    .cell[data-symbol="O"] {
        color: #3b82f6; /* Bleu */
    }

    #restart-button {
        background-color: #10b981;
        color: white;
        margin-top: 10px;
        padding: 12px 30px;
        max-width: 200px;
    }

    #restart-button:hover:not(:disabled) {
        background-color: #059669;
    }

    /* Chatbox */
    .chat-container {
        width: 100%;
        max-width: 320px; 
        height: 350px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #334155;
        margin-top: 20px;
    }
    .chat-header {
        padding: 12px;
        background: #111827;
        color: #f8fafc;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; }
    #chat-messages {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
    }
    #chat-messages::-webkit-scrollbar { width: 6px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .message {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.4;
        word-wrap: break-word;
        text-align: left;
        animation: fadeIn 0.2s ease-out;
    }
    .message.incoming { align-self: flex-start; background-color: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
    .message.outgoing { align-self: flex-end; background-color: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .chat-footer {
        display: flex;
        padding: 8px;
        gap: 8px;
        background: #111827;
        border-top: 1px solid #334155;
    }
    .chat-footer input {
        flex: 1;
        padding: 8px 12px;
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 9999px;
        color: #fff;
        outline: none;
        font-size: 13px;
    }
    .chat-footer input:focus { border-color: #3b82f6; }
    .chat-footer button { width: auto; padding: 0 14px; border-radius: 9999px; font-size: 13px; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
    <fieldset id="join-inputs">
        <input type="text" id="code-input" placeholder="CODE DE LA PARTIE" maxlength="6" autocomplete="off" spellcheck="false">
        <button id="btn-join">Rejoindre une partie</button>
        <button id="btn-create">Connexion au serveur...</button>
    </fieldset>
    <fieldset id="game-infos" style="border: 0;">
        <div id="game-code"></div>
        <div id="status"></div>
    </fieldset>

    <fieldset id="game-board">
        <h1 id="winner-text"></h1>
        <div id="score-text"></div>
        <div id="turn-indicator">En attente des joueurs...</div>
        
        <div class="grid">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <button id="restart-button" style="display: none;">Rejouer</button>
        
        <div class="chat-container">
            <div class="chat-header">
                <span class="status-dot"></span>
                <span>Chat de la partie</span>
            </div>
            <div id="chat-messages"></div>
            <form class="chat-footer" id="chat-form">
                <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" />
                <button type="submit" id="btn-send-chat">Envoyer</button>
            </form>
        </div>
    </fieldset>

    <script>
        const HUB_URL = "/tictactoe";

        const btnCreate = document.getElementById("btn-create");
        const btnJoin = document.getElementById("btn-join");
        const codeDisplay = document.getElementById("game-code");
        const statusDisplay = document.getElementById("status");
        const codeInput = document.getElementById("code-input");
        const joinInputs = document.getElementById("join-inputs");
        const gameInfos = document.getElementById("game-infos");
        const gameBoard = document.getElementById("game-board");
        const turnIndicator = document.getElementById("turn-indicator");
        const winnerText = document.getElementById("winner-text");
        const cells = document.querySelectorAll(".cell");
        const restartButton = document.getElementById("restart-button");
        const scoreText = document.getElementById("score-text");

        const chatMessages = document.getElementById("chat-messages");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");

        const connection = new signalR.HubConnectionBuilder()
            .withUrl(HUB_URL)
            .withAutomaticReconnect()
            .build();

        connection.on("PlayerJoined", (opponentConnectionId) => {
            statusDisplay.textContent = `Un adversaire s'est connecté ! (${opponentConnectionId})`;
            statusDisplay.style.color = "green";
            addChatMessage("Un adversaire a rejoint la partie.", "incoming");
        });

        let mySymbol = null;
        let isMyTurn = false;
        let gameId = null;

        connection.on("GameStarted", (data) => {
            gameBoard.style.display = "flex";
            gameInfos.style.display = "none";
            joinInputs.style.display = "none";

            mySymbol = data.symbol;
            isMyTurn = data.yourTurn;
            gameId = data.id;

            if(isMyTurn){
                turnIndicator.textContent = "C'est à vous de jouer.";
            }else{
                turnIndicator.textContent = "Tour de l'adversaire en cours.";
            }
        });

        connection.on("UpdateTurn", (currentTurnId) => {
            if (connection.connectionId === currentTurnId) {
                turnIndicator.textContent = "C'est à votre tour !";
                turnIndicator.style.color = "green";
            } else {
                turnIndicator.textContent = "Au tour de l'adversaire...";
                turnIndicator.style.color = "gray";
            }
        });

        connection.on("TurnPlayed", (data) => {
            const cell = document.querySelector(`.cell[data-index="${data.cell}"]`);
            cell.textContent = data.symbol;
            cell.setAttribute("data-symbol", data.symbol); 
        });

        connection.on("GameOver", (data) => {
            console.log("Game over, winner : " + data.winner + " my symbol : " + mySymbol);
            if(data.winner == "Draw"){
                winnerText.textContent = "Egalité !"
            }else{
                if(data.winner == mySymbol){
                    winnerText.textContent = "Vous avez gagné !";
                }else{
                    winnerText.textContent = "Vous avez perdu !";
                }
            }

            if(mySymbol == "X"){
                restartButton.style.display = "block";
            }

            scoreText.style.display = "block";
            if (mySymbol === "X") {
                scoreText.innerHTML = `<strong>SCORE</strong><br>X (vous) : ${data.hostScore} &nbsp;|&nbsp; O : ${data.opponentScore}`;
            } else {
                scoreText.innerHTML = `<strong>SCORE</strong><br>X : ${data.hostScore} &nbsp;|&nbsp; O (vous) : ${data.opponentScore}`;
            }
        });

        connection.on("RestartGame", (data) => {
            document.querySelectorAll(".cell").forEach(cell => {
                cell.textContent = "";
                cell.disabled = false;
                cell.removeAttribute("data-symbol"); 
            });

            restartButton.style.display = "none";
            winnerText.textContent = "";

            if (connection.connectionId == data.currentTurn) {
                turnIndicator.textContent = "C'est à votre tour !";
                turnIndicator.style.color = "green";
            } else {
                turnIndicator.textContent = "Au tour de l'adversaire...";
                turnIndicator.style.color = "gray";
            }
        });

        connection.start()
            .then(() => { btnCreate.textContent = "Créer une partie"; })
            .catch(err => {
                console.error("Erreur de connexion SignalR :", err);
                btnCreate.textContent = "Erreur de connexion";
            });

        btnCreate.addEventListener("click", async () => {
            try {
                const gameId = await connection.invoke("CreateGame");
                codeDisplay.textContent = `Code de la partie : ${gameId}`;
                statusDisplay.textContent = "En attente d'un adversaire...";
                joinInputs.disabled = true;
                joinInputs.style.display = "none";
                console.log("Partie créer avec succès");
            } catch (err) {
                console.error("Erreur lors de la création :", err);
            }
        });

        btnJoin.addEventListener("click", async () => {
            try{
                res = await connection.invoke("JoinGame", codeInput.value);
                if(!res) {
                    statusDisplay.textContent = `Aucune partie avec le code ${codeInput.value.toUpperCase()} trouvée`;
                }
            } catch (err) { console.error("Erreur lors du join :", err); }
        });

        restartButton.addEventListener("click", async () => {
            try{ await connection.invoke("RestartGame"); } 
            catch (err) { console.error("Erreur lors du restart :", err); }
        });

        cells.forEach(cell => {
            cell.addEventListener("click", async () => {
                const cellIndex = parseInt(cell.getAttribute("data-index"), 10);
                try { await connection.invoke("PlayTurn", cellIndex); } 
                catch (err) { console.error("Erreur lors du coup :", err); }
            });
        });

        function addChatMessage(text, type = 'outgoing') {
            const msg = document.createElement("div");
            msg.className = `message ${type}`;
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            addChatMessage(text, "outgoing");
            chatInput.value = "";

            try { await connection.invoke("SendMessage", text); } 
            catch (err) { console.error(err); } 
        });

        connection.on("ReceiveMessage", (message) => {
            addChatMessage(message, "incoming");
        });
    </script>
</body>
</html>
