<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer une partie</title>
    <!-- SDK client SignalR officiel via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 40px 20px;
        text-align: center;
        background-color: #0f172a;
        color: #f8fafc;
    }

    #join-inputs {
        border: none;
        padding: 0;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 320px;
    }

    /* Champ de saisie du code */
    #code-input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 16px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-align: center;
        background: #1e293b;
        color: #f8fafc;
        border: 2px solid #334155;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #code-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    #code-input::placeholder {
        letter-spacing: normal;
        font-weight: 400;
        font-size: 14px;
        color: #64748b;
    }

    /* Style général des boutons */
    button {
        width: 100%;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.05s, opacity 0.2s;
    }

    button:active:not(:disabled) {
        transform: scale(0.98);
    }

    /* Bouton principal (Créer) */
    #btn-create {
        background-color: #2563eb;
        color: #ffffff;
    }

    #btn-create:hover:not(:disabled) {
        background-color: #1d4ed8;
    }

    /* Bouton secondaire (Rejoindre) */
    #btn-join {
        background-color: #334155;
        color: #f1f5f9;
    }

    #btn-join:hover:not(:disabled) {
        background-color: #475569;
    }

    /* État désactivé / connexion */
    button:disabled,
    fieldset:disabled button,
    fieldset:disabled input {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(0.2);
    }

    #game-code {
        margin-top: 24px;
        font-size: 22px;
        font-weight: 700;
        color: #60a5fa;
        letter-spacing: 2px;
    }

    #status {
        margin-top: 8px;
        font-size: 14px;
        color: #94a3b8;
    }

    /* Styles ajoutés pour le plateau */
    #game-board {
        border: none;
        padding: 0;
        margin: 30px auto 0 auto;
        display: none; /* Rendu visible en flex quand la partie commence */
        flex-direction: column;
        align-items: center;
        gap: 16px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 90px);
        grid-gap: 10px;
        justify-content: center;
    }

    .cell {
        width: 90px;
        height: 90px;
        font-size: 38px;
        font-weight: 800;
        background-color: #1e293b;
        color: #f8fafc;
        border: 2px solid #334155;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s, border-color 0.15s;
    }

    .cell:hover:not(:disabled) {
        background-color: #334155;
        border-color: #3b82f6;
    }

    .cell:disabled {
        cursor: not-allowed;
    }

    #turn-indicator {
        font-size: 16px;
        font-weight: 600;
        color: #cbd5e1;
    }

    /* --- STYLES DE LA CHATBOX --- */
    .chat-container {
        width: 100%;
        max-width: 320px; /* Aligné sur la taille de la grille et des boutons */
        height: 350px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #334155;
        margin-top: 20px;
    }

    .chat-header {
        padding: 12px;
        background: #111827;
        color: #f8fafc;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        background-color: #22c55e;
        border-radius: 50%;
    }

    #chat-messages {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
    }

    #chat-messages::-webkit-scrollbar { width: 6px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    .message {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.4;
        word-wrap: break-word;
        text-align: left;
        animation: fadeIn 0.2s ease-out;
    }

    .message.incoming {
        align-self: flex-start;
        background-color: #334155;
        color: #f1f5f9;
        border-bottom-left-radius: 2px;
    }

    .message.outgoing {
        align-self: flex-end;
        background-color: #2563eb;
        color: #ffffff;
        border-bottom-right-radius: 2px;
    }

    .chat-footer {
        display: flex;
        padding: 8px;
        gap: 8px;
        background: #111827;
        border-top: 1px solid #334155;
    }

    .chat-footer input {
        flex: 1;
        padding: 8px 12px;
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 9999px;
        color: #fff;
        outline: none;
        font-size: 13px;
    }

    .chat-footer input:focus {
        border-color: #3b82f6;
    }

    .chat-footer button {
        width: auto;
        padding: 0 14px;
        border-radius: 9999px;
        font-size: 13px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
    <fieldset id="join-inputs">
        <input type="text" id="code-input" placeholder="CODE DE LA PARTIE" maxlength="6" autocomplete="off" spellcheck="false">
        <button id="btn-join">Rejoindre une partie</button>
        <button id="btn-create">Connexion au serveur...</button>
    </fieldset>
    <fieldset id="game-infos" style="border: 0;">
        <div id="game-code"></div>
        <div id="status"></div>
    </fieldset>

    <fieldset id="game-board">
        <h1 id="winner-text"></h1>
        <div id="turn-indicator">En attente des joueurs...</div>
        <div class="grid">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        
        <!-- INTÉGRATION DE LA CHATBOX ICI -->
        <div class="chat-container">
            <div class="chat-header">
                <span class="status-dot"></span>
                <span>Chat de la partie</span>
            </div>
            <div id="chat-messages"></div>
            <form class="chat-footer" id="chat-form">
                <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" />
                <button type="submit" id="btn-send-chat">Envoyer</button>
            </form>
        </div>
    </fieldset>

    <script>
        const HUB_URL = "http://localhost:5065/tictactoe";

        const btnCreate = document.getElementById("btn-create");
        const btnJoin = document.getElementById("btn-join");
        const codeDisplay = document.getElementById("game-code");
        const statusDisplay = document.getElementById("status");
        const codeInput = document.getElementById("code-input");
        const joinInputs = document.getElementById("join-inputs");
        const gameInfos = document.getElementById("game-infos");
        const gameBoard = document.getElementById("game-board");
        const turnIndicator = document.getElementById("turn-indicator");
        const winnerText = document.getElementById("winner-text");
        const cells = document.querySelectorAll(".cell");

        // Éléments de la chatbox
        const chatMessages = document.getElementById("chat-messages");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");

        // Initialiser la connexion
        const connection = new signalR.HubConnectionBuilder()
            .withUrl(HUB_URL)
            .withAutomaticReconnect()
            .build();

        // Écouter si un adversaire rejoint la salle créée
        connection.on("PlayerJoined", (opponentConnectionId) => {
            statusDisplay.textContent = `Un adversaire s'est connecté ! (${opponentConnectionId})`;
            statusDisplay.style.color = "green";
            addChatMessage("Un adversaire a rejoint la partie.", "incoming");
        });

        let mySymbol = null;
        let isMyTurn = false;
        let gameId = null;

        connection.on("GameStarted", (data) => {
            gameBoard.style.display = "flex";
            gameInfos.style.display = "none";
            joinInputs.style.display = "none";

            mySymbol = data.symbol;
            isMyTurn = data.yourTurn;
            gameId = data.id;

            if(isMyTurn){
                turnIndicator.textContent = "C'est à vous de jouer.";
            }else{
                turnIndicator.textContent = "Tour de l'adversaire en cours.";
            }
        });

        connection.on("UpdateTurn", (currentTurnId) => {
            if (connection.connectionId === currentTurnId) {
                turnIndicator.textContent = "C'est à votre tour !";
                turnIndicator.style.color = "green";
            } else {
                turnIndicator.textContent = "Au tour de l'adversaire...";
                turnIndicator.style.color = "gray";
            }
        });

        connection.on("TurnPlayed", (data) => {
            const cell = document.querySelector(`.cell[data-index="${data.cell}"]`);
            cell.textContent = data.symbol;
        });

        connection.on("GameOver", (data) => {
            console.log("Game over, winner : " + data + " my symbol : " + mySymbol);
            if(data == "Draw"){
                winnerText.textContent = "Egalité !"
            }else{
                if(data == mySymbol){
                    winnerText.textContent = "Vous avez gagné !";
                }else{
                    winnerText.textContent = "Vous avez perdu !";
                }
            }
        });

        // Démarrer la connexion
        connection.start()
            .then(() => {
                btnCreate.textContent = "Créer une partie";
            })
            .catch(err => {
                console.error("Erreur de connexion SignalR :", err);
                btnCreate.textContent = "Erreur de connexion";
            });

        // Appel de CreateGame lors du clic
        btnCreate.addEventListener("click", async () => {
            try {
                // invoke retourne directement le string renvoyé par le Hub C#
                const gameId = await connection.invoke("CreateGame");
                codeDisplay.textContent = `Code de la partie : ${gameId}`;
                statusDisplay.textContent = "En attente d'un adversaire...";
                joinInputs.disabled = true;
                joinInputs.style.display = "none";
                console.log("Partie créer avec succès");
            } catch (err) {
                console.error("Erreur lors de la création :", err);
            }
        });

        btnJoin.addEventListener("click", async () => {
            try{
                res = await connection.invoke("JoinGame", codeInput.value);
                if(!res)
                {
                    statusDisplay.textContent = `Aucune partie avec le code ${codeInput.value.toUpperCase()} trouvée`;
                }
            } catch (err) {
                console.error("Erreur lors du join :", err);
            }
        });

        // Gestion du clic sur les cases du Morpion
        cells.forEach(cell => {
            cell.addEventListener("click", async () => {
                const cellIndex = parseInt(cell.getAttribute("data-index"), 10);
                try {
                    await connection.invoke("PlayTurn", cellIndex);
                } catch (err) {
                    console.error("Erreur lors du coup :", err);
                }
            });
        });

        /* --- LOGIQUE DE LA CHATBOX --- */
        function addChatMessage(text, type = 'outgoing') {
            const msg = document.createElement("div");
            msg.className = `message ${type}`;
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Soumission du formulaire de chat
        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            // Affichage local du message envoyé
            addChatMessage(text, "outgoing");
            chatInput.value = "";

            try {
                console.log("Send message : " + text);
                await connection.invoke("SendMessage", text);
            } catch (err) {
                console.error(err);
            } 
             
        });

        connection.on("ReceiveMessage", (message) => {
            addChatMessage(message, "incoming");
        });
         
    </script>
</body>
</html>
